<!doctype html>
<html>
<head><meta charset="utf-8"><title>Application</title></head>
<body>
<!-- Mix of Greenhouse- and Lever-style markup. Submitting only sets a flag. -->
<form id="application" onsubmit="event.preventDefault(); document.body.dataset.submitted = 'yes'">
  <label for="first_name">First Name *</label>
  <input id="first_name" name="first_name" required>

  <label for="email">Email *</label>
  <input id="email" name="email" type="email" required>

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel">

  <label for="resume">Resume/CV *</label>
  <input id="resume" name="resume" type="file" style="display:none" required>

  <label for="cover">Cover Letter</label>
  <textarea id="cover" name="cover"></textarea>

  <label for="auth">Are you legally authorized to work in the US? *</label>
  <select id="auth" name="auth" required>
    <option value="">Select...</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
  </select>

  <fieldset>
    <legend>Will you now or in the future require visa sponsorship?</legend>
    <label><input type="radio" name="sponsor" value="y"> Yes</label>
    <label><input type="radio" name="sponsor" value="n"> No</label>
  </fieldset>

  <div class="application-question">
    <div class="text">Which areas interest you?</div>
    <ul>
      <li><label><input type="checkbox" name="areas" value="a"><span>Red team</span></label></li>
      <li><label><input type="checkbox" name="areas" value="b"><span>AppSec</span></label></li>
      <li><label><input type="checkbox" name="areas" value="c"><span>GRC</span></label></li>
    </ul>
  </div>

  <label><input type="checkbox" id="consent" name="consent" style="display:none"> I agree to the privacy policy</label>

  <label id="loc-label">Location (City)</label>
  <input id="loc" role="combobox" aria-autocomplete="list" aria-labelledby="loc-label"
         oninput="document.getElementById('loc-menu').hidden = !this.value">
  <ul id="loc-menu" role="listbox" hidden>
    <li role="option" onclick="document.getElementById('loc').dataset.picked = 'Boston, MA'; this.parentNode.hidden = true">Boston, MA</li>
  </ul>

  <input type="hidden" name="token" value="abc">
  <input type="search" placeholder="Search jobs">
  <button type="submit">Submit Application</button>
</form>
</body>
</html>
